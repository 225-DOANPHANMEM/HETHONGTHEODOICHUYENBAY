<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết chuyến bay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .sidebar { background: linear-gradient(180deg, #1e2937 0%, #0f172a 100%); }
    </style>
</head>
<body class="min-h-screen flex font-sans bg-gray-50">

    <!-- Sidebar -->
    <div class="sidebar w-72 text-white flex flex-col">
        <div class="p-6 border-b border-slate-700">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-plane text-4xl text-blue-400"></i>
                <div>
                    <h1 class="text-2xl font-bold">DANANG</h1>
                    <p class="text-blue-300 text-sm">International Airport</p>
                </div>
            </div>
        </div>
        <div class="flex-1 p-4 space-y-1">
            <a href="tracuuchuyenbay.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-700">
                <i class="fa-solid fa-magnifying-glass"></i><span>Quản lý chuyến bay</span>
            </a>
            <a href="capnhattrangthai.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-700">
                <i class="fa-solid fa-edit"></i><span>Cập nhật trạng thái</span>
            </a>
             <a href="#" class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white">
                <i class="fa-solid fa-user w-5"></i>
                <span>Thông tin tài khoản</span>
            </a>
        </div>
        <div class="p-4 border-t border-slate-700">
            <button onclick="dangXuat()" class="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-900/30 rounded-xl">
                <i class="fa-solid fa-right-from-bracket"></i><span>Đăng xuất</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Chi tiết chuyến bay</h2>
            
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div id="chiTietContent">
                    <!-- Nội dung sẽ được JS load -->
                </div>
            </div>
        </div>
    </div>

    <script>
    let currentFlight = null;

    function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    function loadChiTiet() {
        const ma = getUrlParameter('ma');
        if (!ma) {
            document.getElementById('chiTietContent').innerHTML = `<p class="text-red-500 text-center py-10">Không tìm thấy chuyến bay!</p>`;
            return;
        }

        // Demo data
        currentFlight = {
            soHieu: ma,
            ngay: "2026-05-19",
            gioDuKien: "14:30",
            trangThai: "DELAYED",
            gioThucTe: "15:15",
            cong: "C12",
            bangChuyen: "B03"
        };

        renderForm();
    }

    function renderForm() {
        const html = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <h3 class="font-semibold text-lg mb-4">Thông tin chuyến bay</h3>
                    <div class="space-y-4 bg-gray-50 p-6 rounded-xl">
                        <p><strong>Số hiệu:</strong> <span class="font-mono text-xl">${currentFlight.soHieu}</span></p>
                        <p><strong>Ngày bay:</strong> ${currentFlight.ngay}</p>
                        <p><strong>Giờ dự kiến:</strong> ${currentFlight.gioDuKien}</p>
                    </div>
                </div>

                <div>
                    <h3 class="font-semibold text-lg mb-4">Cập nhật thông tin</h3>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium mb-1">Trạng thái mới</label>
                            <select id="trangThai" onchange="handleTrangThaiChange()" class="w-full p-3 border rounded-xl">
                                <option value="ON_TIME">Đúng giờ</option>
                                <option value="DELAYED" selected>Delay</option>
                                <option value="BOARDING">Đang boarding</option>
                                <option value="DEPARTED">Đã khởi hành</option>
                                <option value="ARRIVED">Đã đến</option>
                            </select>
                        </div>

                        <div id="lyDoDelayGroup">
                            <label class="block text-sm font-medium mb-1">Lý do delay <span class="text-red-500">*</span></label>
                            <textarea id="lyDoDelay" rows="3" class="w-full p-3 border rounded-xl" placeholder="Máy bay trễ do thời tiết..."></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1">Giờ thực tế</label>
                            <input type="time" id="gioThucTe" value="${currentFlight.gioThucTe}" 
                                   onchange="tinhDelay()" class="w-full p-3 border rounded-xl">
                        </div>

                        <div id="delayInfo" class="bg-orange-50 border border-orange-200 p-4 rounded-xl hidden">
                            <p class="text-orange-700 font-medium">Số phút delay: <span id="soPhutDelay" class="font-bold">45</span> </p>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-1">Cổng máy bay</label>
                            <input type="text" id="cong" value="${currentFlight.cong}" class="w-full p-3 border rounded-xl">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Băng chuyền hành lý</label>
                            <input type="text" id="bangChuyen" value="${currentFlight.bangChuyen}" class="w-full p-3 border rounded-xl">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-10 flex justify-end gap-4">
                <button onclick="window.history.back()" class="px-8 py-3 border border-gray-300 rounded-xl hover:bg-gray-100">Quay lại</button>
                <button onclick="luuChinhSua()" class="bg-green-600 hover:bg-green-700 text-white px-10 py-3 rounded-xl font-medium">
                     Lưu thay đổi
                </button>
            </div>
        `;

        document.getElementById('chiTietContent').innerHTML = html;
        handleTrangThaiChange();
    }

    function handleTrangThaiChange() {
        const trangThai = document.getElementById('trangThai').value;
        const lyDoGroup = document.getElementById('lyDoDelayGroup');
        
        if (trangThai === 'DELAYED') {
            lyDoGroup.classList.remove('hidden');
            tinhDelay();
        } else {
            lyDoGroup.classList.add('hidden');
            document.getElementById('delayInfo').classList.add('hidden');
        }
    }

    function tinhDelay() {
            const gioDuKien = "14:30"; 
            const gioThucTe = document.getElementById('gioThucTe').value;
            
            if (!gioThucTe) {
                document.getElementById('delayInfo').classList.add('hidden');
                return;
            }

            const [h1, m1] = gioDuKien.split(':').map(Number);
            const [h2, m2] = gioThucTe.split(':').map(Number);

            let totalPhut = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (totalPhut < 0) totalPhut = 0;

            let displayText = "";
            
            if (totalPhut < 60) {
                displayText = `${totalPhut} phút`;
            } else {
                const gio = Math.floor(totalPhut / 60);
                const phut = totalPhut % 60;
                if (phut === 0) {
                    displayText = `${gio} giờ`;
                } else {
                    displayText = `${gio} giờ ${phut} phút`;
                }
            }

            // Hiển thị
            const delayDiv = document.getElementById('delayInfo');
            document.getElementById('soPhutDelay').innerHTML = displayText;
            delayDiv.classList.remove('hidden');
        } 

    function luuChinhSua() {
        const trangThai = document.getElementById('trangThai').value;
        const lyDo = document.getElementById('lyDoDelay') ? document.getElementById('lyDoDelay').value.trim() : "";

        if ((trangThai === 'DELAYED') && !lyDo) {
            alert("Vui lòng nhập lý do delay!");
            return;
        }

        alert(`✅ Đã cập nhật thành công chuyến bay ${currentFlight.soHieu}!\nTrạng thái: ${trangThai}`);
        
        // Quay về trang tra cứu sau 800ms
        setTimeout(() => {
            window.location.href = "tracuuchuyenbay.html";
        }, 800);
    }

    window.onload = loadChiTiet;
</script>
</body>
</html>
