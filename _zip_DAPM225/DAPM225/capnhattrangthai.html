<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết chuyến bay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .sidebar { background: linear-gradient(180deg, #1e2937 0%, #0f172a 100%); }
    </style>
</head>
<body class="min-h-screen flex font-sans bg-gray-50">

    <!-- Sidebar -->
    <div class="sidebar w-72 text-white flex flex-col">
        <div class="p-6 border-b border-slate-700">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-plane text-4xl text-blue-400"></i>
                <div>
                    <h1 class="text-2xl font-bold">DANANG</h1>
                    <p class="text-blue-300 text-sm">International Airport</p>
                </div>
            </div>
        </div>
        <div class="flex-1 p-4 space-y-1">
            <a href="tracuuchuyenbay.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-700">
                <i class="fa-solid fa-magnifying-glass"></i><span>Quản lý chuyến bay</span>
            </a>
            <a href="capnhattrangthai.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-700">
                <i class="fa-solid fa-edit"></i><span>Cập nhật trạng thái</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white">
                <i class="fa-solid fa-user"></i><span>Thông tin tài khoản</span>
            </a>
        </div>
        <div class="p-4 border-t border-slate-700">
            <button onclick="dangXuat()" class="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-900/30 rounded-xl">
                <i class="fa-solid fa-right-from-bracket"></i><span>Đăng xuất</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Chi tiết chuyến bay</h2>
                <a href="tracuuchuyenbay.html" class="text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </a>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div id="chiTietContent">
                    <!-- Nội dung sẽ được JS load -->
                </div>
            </div>
        </div>
    </div>

    <script>
    let currentFlight = null;

    function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    function loadChiTiet() {
        const ma = getUrlParameter('ma');
        if (!ma) {
            document.getElementById('chiTietContent').innerHTML = `<p class="text-red-500 text-center py-10">Không tìm thấy chuyến bay!</p>`;
            return;
        }

        // Demo data đầy đủ
        currentFlight = {
            soHieu: ma,
            hangBay: "Vietnam Airlines",
            maLichTrinh: "LT20260519001",
            maChuyenBay: "CBVN1320519",
            ngay: "2026-05-19",
            loaiChuyenBay: "DEN",
            gioDuKienKhoiHanh: "14:30",
            gioDuKienHaCanh: "15:45",
            gioUocTinhKhoiHanh: "14:30",
            gioUocTinhHaCanh: "15:45",
            gioThucTeKhoiHanh: "",
            gioThucTeHaCanh: "",
            trangThai: "ON_TIME",
            lyDo: "",
            cong: "C12",
            bangChuyen: "B03"
        };

        // Đọc dữ liệu từ localStorage
        const duLieuCapNhat = JSON.parse(localStorage.getItem('danhSachCapNhat')) || [];
        const daCapNhat = duLieuCapNhat.find(cb => cb.soHieu === ma);
        
        if (daCapNhat) {
            currentFlight = { ...currentFlight, ...daCapNhat };
        }

        renderForm();
    }

    function renderForm() {
        const html = `
            <!-- Thông tin cơ bản -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-blue-50 p-4 rounded-xl">
                    <p class="text-sm text-gray-500 mb-1">Số hiệu chuyến bay</p>
                    <p class="text-2xl font-bold text-blue-700">${currentFlight.soHieu}</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl">
                    <p class="text-sm text-gray-500 mb-1">Hãng bay</p>
                    <p class="text-xl font-semibold text-gray-800">${currentFlight.hangBay}</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl">
                    <p class="text-sm text-gray-500 mb-1">Mã lịch trình</p>
                    <p class="text-lg font-mono text-gray-800">${currentFlight.maLichTrinh}</p>
                </div>
                <div class="bg-gray-50 p-4 rounded-xl">
                    <p class="text-sm text-gray-500 mb-1">Mã chuyến bay</p>
                    <p class="text-lg font-mono text-gray-800">${currentFlight.maChuyenBay}</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Cột trái: Thời gian -->
                <div>
                    <h3 class="font-semibold text-lg mb-4 flex items-center gap-2">
                        <i class="fa-regular fa-clock text-blue-600"></i>
                        Thông tin thời gian
                    </h3>
                    
                    <div class="space-y-5 bg-gray-50 p-6 rounded-xl">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Ngày bay</label>
                                <input type="date" id="ngay" value="${currentFlight.ngay}" class="w-full p-2 border rounded-lg bg-white" readonly>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Loại chuyến bay</label>
                                <input type="text" value="${currentFlight.loaiChuyenBay === 'DEN' ? 'Đến' : 'Đi'}" class="w-full p-2 border rounded-lg bg-white" readonly>
                            </div>
                        </div>

                        <div class="border-t pt-4">
                            <p class="font-medium text-gray-700 mb-2">⏱️ Dự kiến</p>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Khởi hành</label>
                                    <input type="time" id="gioDuKienKhoiHanh" value="${currentFlight.gioDuKienKhoiHanh}" class="w-full p-2 border rounded-lg bg-white">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Hạ cánh</label>
                                    <input type="time" id="gioDuKienHaCanh" value="${currentFlight.gioDuKienHaCanh}" class="w-full p-2 border rounded-lg bg-white">
                                </div>
                            </div>
                        </div>

                        <div class="border-t pt-4">
                            <p class="font-medium text-gray-700 mb-2">📊 Ước tính</p>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Khởi hành</label>
                                    <input type="time" id="gioUocTinhKhoiHanh" value="${currentFlight.gioUocTinhKhoiHanh}" class="w-full p-2 border rounded-lg bg-white">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Hạ cánh</label>
                                    <input type="time" id="gioUocTinhHaCanh" value="${currentFlight.gioUocTinhHaCanh}" class="w-full p-2 border rounded-lg bg-white">
                                </div>
                            </div>
                        </div>

                        <div class="border-t pt-4">
                            <p class="font-medium text-gray-700 mb-2">✈️ Thực tế</p>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Khởi hành <span class="text-red-500">*</span></label>
                                    <input type="time" id="gioThucTeKhoiHanh" value="${currentFlight.gioThucTeKhoiHanh}" onchange="tinhDelay()" class="w-full p-2 border rounded-lg bg-white">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Hạ cánh</label>
                                    <input type="time" id="gioThucTeHaCanh" value="${currentFlight.gioThucTeHaCanh}" class="w-full p-2 border rounded-lg bg-white">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cột phải: Cập nhật trạng thái -->
                <div>
                    <h3 class="font-semibold text-lg mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-blue-600"></i>
                        Cập nhật trạng thái
                    </h3>
                    
                    <div class="space-y-5 bg-gray-50 p-6 rounded-xl">
                        <div>
                            <label class="block text-sm font-medium mb-1">Trạng thái</label>
                            <select id="trangThai" onchange="handleTrangThaiChange()" class="w-full p-3 border rounded-xl bg-white">
                                <option value="ON_TIME" ${currentFlight.trangThai === 'ON_TIME' ? 'selected' : ''}>Đúng giờ</option>
                                <option value="DELAYED" ${currentFlight.trangThai === 'DELAYED' ? 'selected' : ''}>Chậm (Delay)</option>
                                <option value="BOARDING" ${currentFlight.trangThai === 'BOARDING' ? 'selected' : ''}>Đang boarding</option>
                                <option value="DEPARTED" ${currentFlight.trangThai === 'DEPARTED' ? 'selected' : ''}>Đã khởi hành</option>
                                <option value="ARRIVED" ${currentFlight.trangThai === 'ARRIVED' ? 'selected' : ''}>Đã hạ cánh</option>
                                <option value="CANCELLED" ${currentFlight.trangThai === 'CANCELLED' ? 'selected' : ''}>Hủy chuyến</option>
                            </select>
                        </div>

                        <div id="lyDoGroup" class="${currentFlight.trangThai === 'DELAYED' || currentFlight.trangThai === 'CANCELLED' ? '' : 'hidden'}">
                            <label class="block text-sm font-medium mb-1">Lý do chậm/hủy <span class="text-red-500">*</span></label>
                            <textarea id="lyDo" rows="3" class="w-full p-3 border rounded-xl bg-white" placeholder="Nhập lý do chậm hoặc hủy chuyến...">${currentFlight.lyDo || ''}</textarea>
                        </div>

                        <div id="delayInfo" class="bg-orange-50 border border-orange-200 p-4 rounded-xl hidden">
                            <p class="text-orange-700 font-medium">
                                <i class="fa-solid fa-clock"></i> Số phút chậm: 
                                <span id="soPhutDelay" class="font-bold text-lg">0</span>
                            </p>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-1">Cổng máy bay</label>
                                <input type="text" id="cong" value="${currentFlight.cong}" class="w-full p-3 border rounded-xl bg-white">
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Băng chuyền hành lý</label>
                                <input type="text" id="bangChuyen" value="${currentFlight.bangChuyen}" class="w-full p-3 border rounded-xl bg-white">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Nút chức năng -->
            <div class="mt-8 flex justify-end gap-4">
                <button onclick="window.location.href='tracuuchuyenbay.html'" class="px-8 py-3 border border-gray-300 rounded-xl hover:bg-gray-100">
                    Hủy
                </button>
                <button onclick="luuChinhSua()" class="bg-green-600 hover:bg-green-700 text-white px-10 py-3 rounded-xl font-medium">
                    <i class="fa-solid fa-save"></i> Lưu thay đổi
                </button>
            </div>
        `;

        document.getElementById('chiTietContent').innerHTML = html;
        handleTrangThaiChange();
    }

    function handleTrangThaiChange() {
        const trangThai = document.getElementById('trangThai').value;
        const lyDoGroup = document.getElementById('lyDoGroup');
        
        if (trangThai === 'DELAYED' || trangThai === 'CANCELLED') {
            lyDoGroup.classList.remove('hidden');
        } else {
            lyDoGroup.classList.add('hidden');
            document.getElementById('lyDo').value = '';
        }
    }

  function tinhDelay() {
    const gioDuKienKhoiHanh = document.getElementById('gioDuKienKhoiHanh').value;
    const gioThucTeKhoiHanh = document.getElementById('gioThucTeKhoiHanh').value;

    console.log("Giá trị dự kiến:", gioDuKienKhoiHanh);
    console.log("Giá trị thực tế:", gioThucTeKhoiHanh);

    if (!gioDuKienKhoiHanh || !gioThucTeKhoiHanh) {
        console.log("Thiếu giá trị, không tính được");
        document.getElementById('delayInfo').classList.add('hidden');
        return;
    }

    const [h1, m1] = gioDuKienKhoiHanh.split(':').map(Number);
    const [h2, m2] = gioThucTeKhoiHanh.split(':').map(Number);
    
    let phutChang = (h2 * 60 + m2) - (h1 * 60 + m1);
    console.log("Số phút chậm:", phutChang);
    
    if (phutChang < 0) phutChang = 0;

    let displayText = "";
    if (phutChang < 60) {
        displayText = `${phutChang} phút`;
    } else {
        const gio = Math.floor(phutChang / 60);
        const phut = phutChang % 60;
        displayText = phut === 0 ? `${gio} giờ` : `${gio} giờ ${phut} phút`;
    }

    console.log("Hiển thị:", displayText);
    
    const delayDiv = document.getElementById('delayInfo');
    document.getElementById('soPhutDelay').innerHTML = displayText;
    delayDiv.classList.remove('hidden');
}

    function luuChinhSua() {
        const trangThai = document.getElementById('trangThai').value;
        const lyDo = document.getElementById('lyDo').value.trim();
        const gioThucTeKhoiHanh = document.getElementById('gioThucTeKhoiHanh').value;
        const gioThucTeHaCanh = document.getElementById('gioThucTeHaCanh').value;

        // Kiểm tra validate
        if ((trangThai === 'DELAYED' || trangThai === 'CANCELLED') && !lyDo) {
            alert("Vui lòng nhập lý do chậm/hủy!");
            return;
        }

        // ✅ Lưu dữ liệu vào localStorage
        const dataCapNhat = {
            soHieu: currentFlight.soHieu,
            hangBay: currentFlight.hangBay,
            maLichTrinh: currentFlight.maLichTrinh,
            maChuyenBay: currentFlight.maChuyenBay,
            ngay: currentFlight.ngay,
            loaiChuyenBay: currentFlight.loaiChuyenBay,
            gioDuKienKhoiHanh: document.getElementById('gioDuKienKhoiHanh').value,
            gioDuKienHaCanh: document.getElementById('gioDuKienHaCanh').value,
            gioUocTinhKhoiHanh: document.getElementById('gioUocTinhKhoiHanh').value,
            gioUocTinhHaCanh: document.getElementById('gioUocTinhHaCanh').value,
            gioThucTeKhoiHanh: gioThucTeKhoiHanh,
            gioThucTeHaCanh: gioThucTeHaCanh,
            trangThai: trangThai,
            lyDo: lyDo,
            cong: document.getElementById('cong').value,
            bangChuyen: document.getElementById('bangChuyen').value
        };
        
        // Lưu vào localStorage
        let danhSachCapNhat = JSON.parse(localStorage.getItem('danhSachCapNhat')) || [];
        
        // Kiểm tra nếu đã có chuyến bay này thì cập nhật, chưa thì thêm mới
        const index = danhSachCapNhat.findIndex(item => item.soHieu === currentFlight.soHieu);
        if (index >= 0) {
            danhSachCapNhat[index] = dataCapNhat;
        } else {
            danhSachCapNhat.push(dataCapNhat);
        }
        
        localStorage.setItem('danhSachCapNhat', JSON.stringify(danhSachCapNhat));

        alert(`✅ Đã cập nhật thành công chuyến bay ${currentFlight.soHieu}!\nTrạng thái: ${trangThai}`);
        
        // Quay về trang tra cứu
        setTimeout(() => {
            window.location.href = "tracuuchuyenbay.html";
        }, 800);
    }

    function lamMoi() {
        renderForm();
    }

    function dangXuat() {
        if(confirm("Bạn có chắc muốn đăng xuất?")) {
            window.location.href = "dangnhap.html";
        }
    }

    window.onload = loadChiTiet;
    </script>
</body>
</html>
