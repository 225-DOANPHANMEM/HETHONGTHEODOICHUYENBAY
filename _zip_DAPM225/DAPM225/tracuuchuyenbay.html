<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu chuyến bay - Nhân viên Điều hành</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .sidebar {
            background: linear-gradient(180deg, #1e2937 0%, #0f172a 100%);
        }
        .menu-item {
            transition: all 0.2s;
        }
        .menu-item:hover {
            background-color: #334155;
        }
        .menu-item-active {
            background-color: #1e40af;
            border-left: 4px solid #60a5fa;
        }
    </style>
</head>
<body class="min-h-screen flex font-sans bg-gray-50">

    <!-- Sidebar -->
    <div class="sidebar w-72 text-white flex flex-col shadow-xl">
        <!-- Logo -->
        <div class="p-6 border-b border-slate-700">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-plane text-4xl text-blue-400"></i>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">DANANG</h1>
                    <p class="text-blue-300 text-sm -mt-1">International Airport</p>
                </div>
            </div>
            <div class="mt-6 text-sm text-blue-200">
                Nhân viên Điều hành Chuyến bay
            </div>
        </div>

        <!-- Menu -->
        <div class="flex-1 px-3 py-6 space-y-1">
            <a href="tracuuchuyenbay.html" class="menu-item menu-item-active flex items-center gap-3 px-4 py-3 rounded-xl text-white font-medium">
                <i class="fa-solid fa-magnifying-glass w-5"></i>
                <span>Quản lý chuyến bay</span>
            </a>
            
            <a href="lichsucapnhat.html" class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white">
                <i class="fa-solid fa-history w-5"></i>
                <span>Lịch sử cập nhật</span>
            </a>
            
            <a href="thongtintaikhoan.html" class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-white">
                <i class="fa-solid fa-user w-5"></i>
                <span>Thông tin tài khoản</span>
            </a>
        </div>

        <!-- Đăng xuất -->
        <div class="p-4 border-t border-slate-700">
            <button onclick="dangXuat()" 
                    class="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-900/30 hover:text-red-300 rounded-xl transition">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Đăng xuất</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800" id="mainTitle">Tra cứu chuyến bay</h2>
                <a href="trangchu.html" class="text-blue-600 hover:underline flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> 
                </a>
            </div>

            <!-- Form tìm kiếm -->
            <div class="bg-white rounded-2xl shadow p-8 mb-8">
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Từ khóa</label>
                        <input type="text" id="searchInput" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600"
                               placeholder="Số hiệu chuyến bay...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ngày bay</label>
                        <input type="date" id="ngayBay" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600">
                    </div>
                    <div class="flex items-end">
                        <button onclick="timKiemChuyenBay()" 
                                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            TRA CỨU
                        </button>
                    </div>
                </div>
            </div>

            <!-- Kết quả -->
            <div class="bg-white rounded-2xl shadow overflow-hidden">
                <div class="px-6 py-4 bg-gray-100 border-b flex justify-between items-center">
                    <h3 class="font-semibold text-gray-700" id="resultTitle">Kết quả tra cứu</h3>
                    <span id="soLuong" class="text-sm text-gray-500"></span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left">Số hiệu</th>
                                <th class="px-6 py-4 text-left">Ngày bay</th>
                                <th class="px-6 py-4 text-left">Loại</th>
                                <th class="px-6 py-4 text-left">Hãng bay</th>
                                <th class="px-6 py-4 text-left">Giờ dự kiến</th>
                                <th class="px-6 py-4 text-left">Trạng thái</th>
                                <th class="px-6 py-4 text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="ketQuaTable" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function timKiemChuyenBay() {
            const keyword = document.getElementById('searchInput').value.toUpperCase().trim();
            const ngayBay = document.getElementById('ngayBay').value;
            const type = getUrlParameter('type');   // DEN hoặc DI

            // ✅ Dữ liệu mẫu ban đầu
            const demoData = [
                { soHieu: "VN132", ngay: "2026-05-19", loai: "DEN", hang: "Vietnam Airlines", gio: "14:30", trangThai: "ON_TIME", cong: "C12" },
                { soHieu: "VJ456", ngay: "2026-05-19", loai: "DI",  hang: "VietJet Air", gio: "16:45", trangThai: "ON_TIME", cong: "A05" },
                { soHieu: "QH789", ngay: "2026-05-19", loai: "DEN", hang: "Bamboo Airways", gio: "19:15", trangThai: "BOARDING", cong: "B02" },
                { soHieu: "VN138", ngay: "2026-05-19", loai: "DI",  hang: "Vietnam Airlines", gio: "08:20", trangThai: "ON_TIME", cong: "C08" },
                { soHieu: "VJ512", ngay: "2026-05-19", loai: "DEN", hang: "VietJet Air", gio: "21:05", trangThai: "ON_TIME", cong: "A11" }
            ];

            // ✅ Đọc dữ liệu đã cập nhật từ localStorage
            const duLieuCapNhat = JSON.parse(localStorage.getItem('danhSachCapNhat')) || [];

            // ✅ Kết hợp demoData với dữ liệu đã cập nhật
            let danhSachChuyenBay = [...demoData];
            
            duLieuCapNhat.forEach(chuyenCapNhat => {
                const index = danhSachChuyenBay.findIndex(cb => cb.soHieu === chuyenCapNhat.soHieu);
                if (index >= 0) {
                    // Cập nhật thông tin từ localStorage
                    danhSachChuyenBay[index] = {
                        ...danhSachChuyenBay[index],
                        trangThai: chuyenCapNhat.trangThai,
                        gio: chuyenCapNhat.gioThucTe || chuyenCapNhat.gioDuKien,
                        cong: chuyenCapNhat.cong,
                        lyDoDelay: chuyenCapNhat.lyDoDelay
                    };
                }
            });

            let filtered = danhSachChuyenBay;

            // Lọc theo type (DEN/DI)
            if (type) {
                filtered = filtered.filter(item => item.loai === type);
            }

            // Lọc theo từ khóa
            if (keyword) {
                filtered = filtered.filter(item => 
                    item.soHieu.toUpperCase().includes(keyword)
                );
            }

            // Hiển thị dữ liệu
            let html = '';
            if (filtered.length === 0) {
                html = `
                    <tr>
                        <td colspan="7" class="px-6 py-16 text-center text-gray-500">
                            <i class="fa-solid fa-magnifying-glass text-5xl mb-4 opacity-30"></i>
                            <p class="text-xl">Không tìm thấy chuyến bay</p>
                        </td>
                    </tr>`;
            } else {
                filtered.forEach(item => {
                    // ✅ Xử lý hiển thị trạng thái
                    let tenTrangThai = '';
                    let mauNen = '';
                    let mauChu = '';
                    
                    switch(item.trangThai) {
                        case 'ON_TIME': 
                            tenTrangThai = 'Đúng giờ'; 
                            mauNen = 'bg-green-100'; mauChu = 'text-green-700'; 
                            break;
                        case 'DELAYED': 
                            tenTrangThai = item.lyDoDelay ? `Delay - ${item.lyDoDelay}` : 'Delay'; 
                            mauNen = 'bg-red-100'; mauChu = 'text-red-700'; 
                            break;
                        case 'BOARDING': 
                            tenTrangThai = 'Đang boarding'; 
                            mauNen = 'bg-blue-100'; mauChu = 'text-blue-700'; 
                            break;
                        case 'DEPARTED': 
                            tenTrangThai = 'Đã khởi hành'; 
                            mauNen = 'bg-purple-100'; mauChu = 'text-purple-700'; 
                            break;
                        case 'ARRIVED': 
                            tenTrangThai = 'Đã đến'; 
                            mauNen = 'bg-gray-100'; mauChu = 'text-gray-700'; 
                            break;
                        default: 
                            tenTrangThai = item.trangThai; 
                            mauNen = 'bg-gray-100'; mauChu = 'text-gray-700';
                    }

                    html += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 font-medium">${item.soHieu}</td>
                            <td class="px-6 py-4">${item.ngay}</td>
                            <td class="px-6 py-4">${item.loai === 'DEN' ? 'Đến' : 'Đi'}</td>
                            <td class="px-6 py-4">${item.hang}</td>
                            <td class="px-6 py-4">${item.gio}</td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 rounded-full text-sm ${mauNen} ${mauChu}">
                                    ${tenTrangThai}
                                </span>
                            </td>
                        <td class="px-6 py-4 text-center space-x-3">
                            <button onclick="xemChiTiet('${item.soHieu}')" 
                                    class="text-blue-600 hover:underline font-medium">Cập nhật</button>
                        </td>
                        </tr>`;
                });
            }

            document.getElementById('ketQuaTable').innerHTML = html;
            document.getElementById('soLuong').textContent = `${filtered.length} chuyến bay`;
        }

        function xemChiTiet(soHieu) {
            window.location.href = `capnhattrangthai.html?ma=${soHieu}`;
        }
        

        // Tự động load theo loại khi vào trang
        window.onload = () => {
            const type = getUrlParameter('type');
            const search = getUrlParameter('search');

            document.getElementById('ngayBay').value = "2026-05-19";

            if (search) {
                document.getElementById('searchInput').value = search;
            }

            if (type === 'DEN') {
                document.getElementById('mainTitle').textContent = "Chuyến bay đến";
                document.getElementById('pageTitle').textContent = "Chuyến bay đến";
            } else if (type === 'DI') {
                document.getElementById('mainTitle').textContent = "Chuyến bay đi";
                document.getElementById('pageTitle').textContent = "Chuyến bay đi";
            }

            timKiemChuyenBay();
        };
    </script>
</body>
</html>
