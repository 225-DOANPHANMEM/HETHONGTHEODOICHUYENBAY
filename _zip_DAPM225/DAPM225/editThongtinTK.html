<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa thông tin tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .sidebar { background: linear-gradient(180deg, #1e2937 0%, #0f172a 100%); }
    </style>
</head>
<body class="min-h-screen flex font-sans bg-gray-50">

    <!-- Sidebar -->
    <div class="sidebar w-72 text-white flex flex-col">
        <div class="p-6 border-b border-slate-700">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-plane text-4xl text-blue-400"></i>
                <div>
                    <h1 class="text-2xl font-bold">DANANG</h1>
                    <p class="text-blue-300 text-sm">International Airport</p>
                </div>
            </div>
        </div>
        <div class="flex-1 p-4 space-y-1">
            <a href="tracuuchuyenbay.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-700">
                <i class="fa-solid fa-magnifying-glass"></i><span>Quản lý chuyến bay</span>
            </a>
            <a href="thongbao.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-700">
                <i class="fa-solid fa-bell"></i><span>Thông báo thay đổi</span>
            </a>
            <a href="lichsucapnhat.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-700">
                <i class="fa-solid fa-clock-rotate-left"></i><span>Lịch sử cập nhật</span>
            </a>
            <a href="taikhoan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-700">
                <i class="fa-solid fa-user"></i><span>Thông tin tài khoản</span>
            </a>
        </div>
        <div class="p-4 border-t border-slate-700">
            <button onclick="dangXuat()" class="w-full flex items-center gap-3 px-4 py-3 text-red-400 hover:bg-red-900/30 rounded-xl">
                <i class="fa-solid fa-right-from-bracket"></i><span>Đăng xuất</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Chỉnh sửa thông tin tài khoản</h2>
                <a href="thongtintaikhoan.html" class="text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại
                </a>
            </div>

            <form id="formChinhSua" onsubmit="luuThongTin(event)">
                <!-- Thông tin cá nhân -->
                <div class="bg-white rounded-2xl shadow-lg p-8 mb-6">
                    <h3 class="font-semibold text-lg mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user text-blue-600"></i>
                        Thông tin cá nhân
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Mã nhân viên</label>
                            <input type="text" id="maNV" class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-100" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Họ và tên <span class="text-red-500">*</span></label>
                            <input type="text" id="hoTen" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Ngày sinh</label>
                            <input type="date" id="ngaySinh" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Giới tính</label>
                            <select id="gioiTinh" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600">
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                                <option value="Khác">Khác</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Số CCCD/CMND</label>
                            <input type="text" id="cccd" maxlength="12" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600" placeholder="012345678901">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Ngày cấp</label>
                            <input type="date" id="ngayCap" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium mb-2">Nơi cấp</label>
                            <input type="text" id="noiCap" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600" placeholder="Đà Nẵng">
                        </div>
                    </div>
                </div>

                <!-- Thông tin liên hệ -->
                <div class="bg-white rounded-2xl shadow-lg p-8 mb-6">
                    <h3 class="font-semibold text-lg mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-address-book text-blue-600"></i>
                        Thông tin liên hệ
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Số điện thoại <span class="text-red-500">*</span></label>
                            <input type="tel" id="sdt" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600" placeholder="0912345678">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Email <span class="text-red-500">*</span></label>
                            <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600" placeholder="nv001@danangairport.vn">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium mb-2">Địa chỉ</label>
                            <textarea id="diaChi" rows="2" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600" placeholder="123 Nguyễn Văn Linh, Hải Châu, Đà Nẵng"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Thông tin công việc -->
                <div class="bg-white rounded-2xl shadow-lg p-8 mb-6">
                    <h3 class="font-semibold text-lg mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-briefcase text-blue-600"></i>
                        Thông tin công việc
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Phòng ban</label>
                            <input type="text" id="phongBan" class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-100" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Chức vụ</label>
                            <input type="text" id="chucVu" class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-100" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Ngày vào làm</label>
                            <input type="date" id="ngayVaoLam" class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-100" readonly>
                        </div>
                    </div>
                </div>

                <!-- Thông tin đăng nhập -->
                <div class="bg-white rounded-2xl shadow-lg p-8 mb-6">
                    <h3 class="font-semibold text-lg mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-lock text-blue-600"></i>
                        Thông tin đăng nhập
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Tên đăng nhập</label>
                            <input type="text" id="tenDangNhap" class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-100" readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Mật khẩu hiện tại <span class="text-red-500">*</span></label>
                            <input type="password" id="matKhauHienTai" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600" placeholder="Nhập mật khẩu hiện tại">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Mật khẩu mới</label>
                            <input type="password" id="matKhauMoi" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600" placeholder="Để trống nếu không đổi">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Xác nhận mật khẩu mới</label>
                            <input type="password" id="xacNhanMatKhau" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-blue-600" placeholder="Xác nhận mật khẩu mới">
                        </div>
                    </div>
                </div>

                <!-- Nút chức năng -->
                <div class="flex justify-end gap-4">
                    <a href="thongtintaikhoan.html" class="px-8 py-3 border border-gray-300 rounded-xl hover:bg-gray-100">
                        Hủy
                    </a>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-xl font-medium">
                        <i class="fa-solid fa-save"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
    // Dữ liệu mẫu nhân viên
    const thongTinNV = {
        maNV: "NV001",
        hoTen: "Nguyễn Văn A",
        ngaySinh: "1990-03-15",
        gioiTinh: "Nam",
        cccd: "012345678901",
        ngayCap: "2015-03-15",
        noiCap: "Đà Nẵng",
        sdt: "0912345678",
        email: "nv001@danangairport.vn",
        diaChi: "123 Nguyễn Văn Linh, Hải Châu, Đà Nẵng",
        phongBan: "Phòng Điều hành Chuyến bay",
        chucVu: "Nhân viên điều hành",
        ngayVaoLam: "2023-01-01",
        tenDangNhap: "nv001"
    };

    // Load thông tin lên form
    function loadThongTin() {
        // Lấy dữ liệu từ localStorage hoặc dữ liệu mẫu
        const data = JSON.parse(localStorage.getItem('thongTinNhanVien')) || thongTinNV;

        document.getElementById('maNV').value = data.maNV;
        document.getElementById('hoTen').value = data.hoTen;
        document.getElementById('ngaySinh').value = data.ngaySinh;
        document.getElementById('gioiTinh').value = data.gioiTinh;
        document.getElementById('cccd').value = data.cccd;
        document.getElementById('ngayCap').value = data.ngayCap;
        document.getElementById('noiCap').value = data.noiCap;
        document.getElementById('sdt').value = data.sdt;
        document.getElementById('email').value = data.email;
        document.getElementById('diaChi').value = data.diaChi;
        document.getElementById('phongBan').value = data.phongBan;
        document.getElementById('chucVu').value = data.chucVu;
        document.getElementById('ngayVaoLam').value = data.ngayVaoLam;
        document.getElementById('tenDangNhap').value = data.tenDangNhap;
    }

    // Lưu thông tin
    function luuThongTin(event) {
        event.preventDefault();

        // Lấy giá trị mật khẩu
        const matKhauHienTai = document.getElementById('matKhauHienTai').value;
        const matKhauMoi = document.getElementById('matKhauMoi').value;
        const xacNhanMatKhau = document.getElementById('xacNhanMatKhau').value;

        // Validate mật khẩu
        if (!matKhauHienTai) {
            alert("Vui lòng nhập mật khẩu hiện tại!");
            return;
        }

        if (matKhauMoi && matKhauMoi !== xacNhanMatKhau) {
            alert("Mật khẩu mới không khớp!");
            return;
        }

        if (matKhauMoi && matKhauMoi.length < 6) {
            alert("Mật khẩu mới phải có ít nhất 6 ký tự!");
            return;
        }

        // Thu thập dữ liệu
        const dataMoi = {
            maNV: document.getElementById('maNV').value,
            hoTen: document.getElementById('hoTen').value,
            ngaySinh: document.getElementById('ngaySinh').value,
            gioiTinh: document.getElementById('gioiTinh').value,
            cccd: document.getElementById('cccd').value,
            ngayCap: document.getElementById('ngayCap').value,
            noiCap: document.getElementById('noiCap').value,
            sdt: document.getElementById('sdt').value,
            email: document.getElementById('email').value,
            diaChi: document.getElementById('diaChi').value,
            phongBan: document.getElementById('phongBan').value,
            chucVu: document.getElementById('chucVu').value,
            ngayVaoLam: document.getElementById('ngayVaoLam').value,
            tenDangNhap: document.getElementById('tenDangNhap').value
        };

                // Lưu vào localStorage
        localStorage.setItem('thongTinNhanVien', JSON.stringify(dataMoi));

        if (matKhauMoi) {
            localStorage.setItem('matKhau', matKhauMoi);
            alert("✅ Đã cập nhật thông tin và mật khẩu thành công!");
        } else {
            alert("✅ Đã cập nhật thông tin thành công!");
        }

        // Chuyển về trang thông tin tài khoản
        setTimeout(() => {
            window.location.href = "thongtintaikhoan.html";
        }, 100);
    }

    function dangXuat() {
        if (confirm("Bạn có chắc muốn đăng xuất?")) {
            window.location.href = "Login.html";
        }
    }

    // Load khi trang được mở
    window.onload = () => {
        loadThongTin();
    };
    </script>
</body>
</html>
